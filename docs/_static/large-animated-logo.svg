<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081019" />
      <stop offset="60%" stop-color="#04080e" />
      <stop offset="100%" stop-color="#020407" />
    </linearGradient>
    <linearGradient id="cyanStream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00416a" />
      <stop offset="30%" stop-color="#00b4db" />
      <stop offset="70%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#a8f5ff" />
    </linearGradient>
    <linearGradient id="tealStream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#021b29" />
      <stop offset="50%" stop-color="#0083b0" />
      <stop offset="100%" stop-color="#80e5ff" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#fff" />
      <stop offset="100%" stop-color="#70e1ff" />
    </linearGradient>
    <filter id="heavyGlow" x="-50%" y="-50%" width="100%" height="100%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="70%" height="80%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" />
    </filter>
    <filter
       style="color-interpolation-filters:sRGB;"
       id="colorShift"
       x="-0.60114071"
       y="-0.13537117"
       width="2.1338404"
       height="1.1982533">
      <feColorMatrix
         type="hueRotate"
         values="277"
         result="color1"
         id="feColorMatrix81" />
      <feColorMatrix
         type="saturate"
         values="1"
         result="color2"
         id="feColorMatrix82" />
    </filter>

    <style>
      @keyframes linePulse {

        0%,
        to {
          stroke-opacity: .35;
          filter: drop-shadow(0 0 1px #00f2fe)
        }

        50% {
          stroke-opacity: 1;
          filter: drop-shadow(0 0 3px #00f2fe)
        }
      }

      @keyframes coreSurge {

        0%,
        to {
          stroke-opacity: .6;
          stroke-width: 3px
        }

        50% {
          stroke-opacity: 1;
          stroke-width: 5px;
          filter: drop-shadow(0 0 12px #fff)
        }
      }

      @keyframes twinkleSparkle {

        0%,
        to {
          opacity: .2;
          transform: scale(.5) rotate(0deg)
        }

        50% {
          opacity: 1;
          transform: scale(1.3) rotate(45deg)
        }
      }

      @keyframes twinkleSoft {

        0%,
        to {
          opacity: .3;
          transform: scale(.7)
        }

        50% {
          opacity: .95;
          transform: scale(1.15)
        }
      }

      @keyframes particleFloat {

        0%,
        to {
          opacity: .1;
          transform: translateY(0)
        }

        50% {
          opacity: 1;
          transform: translateY(-6px)
        }
      }

      .star {
        transform-box: fill-box;
        transform-origin: center
      }

      .line-pulse-1 {
        animation: linePulse 3s ease-in-out infinite 0s
      }

      .line-pulse-2 {
        animation: linePulse 2.4s ease-in-out infinite .4s
      }

      .line-pulse-3 {
        animation: linePulse 3.6s ease-in-out infinite .8s
      }

      .line-pulse-4 {
        animation: linePulse 2.8s ease-in-out infinite 1.2s
      }

      .line-pulse-5 {
        animation: linePulse 3.2s ease-in-out infinite 1.6s
      }

      .star-twinkle-1 {
        animation: twinkleSparkle 2.2s ease-in-out infinite 0s
      }

      .star-twinkle-2 {
        animation: twinkleSparkle 3.1s ease-in-out infinite .5s
      }

      .star-twinkle-3 {
        animation: twinkleSparkle 1.8s ease-in-out infinite 1s
      }

      .star-twinkle-4 {
        animation: twinkleSoft 2.5s ease-in-out infinite .3s
      }

      .star-twinkle-5 {
        animation: twinkleSoft 3.4s ease-in-out infinite .9s
      }

      .p-float-1 {
        animation: particleFloat 1.8s ease-in-out infinite .1s
      }

      .p-float-2 {
        animation: particleFloat 2.3s ease-in-out infinite .6s
      }

      .p-float-3 {
        animation: particleFloat 1.5s ease-in-out infinite 1.1s
      }
    </style>
  </defs>
