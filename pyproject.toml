[project]
name = "faststreambody"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "whichoneiwonder", email = "whichoneiwonder@github.com" }]
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116.1", "uvicorn[standard]>=0.35.0"]

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=8.4.1", "ruff>=0.12.7"]

[tool.ruff]
line-length = 120
lint.select = [
    "E",
    "F",
    "W",
    "C90",
    "B",
    "B9",
    "I",
    "Q",
    "S",
    "T",
    "ERA",
    "ANN",
    "FAST",
    "RUF",
]
lint.per-file-ignores = { "tests/**.py" = ["S101"] }
