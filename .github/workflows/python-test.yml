name: Test and lint
on:
  workflow_dispatch:
  push:
    branches:
    - main
    - release/*    

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v8.1.0
      with:
        python-version: '3.14'
    - name: 'lint'
      run: |
        uvx ruff format --check
        uvx ruff check
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: 
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        dependency-pattern:
          - highest
          - lowest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v8.1.0
      with:
        resolution-strategy: ${{matrix.dependency-pattern}}
        python-version: ${{ matrix.python-version }}
    - name: 'install'
      run: 'uv pip install .[dev]'
    - name: Test with python ${{ matrix.python-version }}
      run: uv run --frozen pytest
      
        
